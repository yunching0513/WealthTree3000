1F" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">資料備份與還原</text><text x="32" y="326" font-size="12" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">你的財務資料只存在這支手機。建議定期匯出備份到</text><text x="32" y="344" font-size="12" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">iCloud / Google Drive，換手機時即可還原 30 年的財富樹。</text><text x="32" y="362" font-size="12" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">開發方伺服器全程不接觸你的資料。</text><text x="32" y="394" font-size="13" fill="#6E6256" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">加密密碼（選填，建議設定）</text><rect x="32" y="406" width="326" height="44" rx="10" fill="#F4F0E6"/><text x="46" y="433" font-size="14" fill="#9C9286" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">留空則匯出明碼 JSON</text><text x="32" y="472" font-size="11" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">設了密碼，備份檔會以 AES 加密；還原時需相同密碼。</text><rect x="32" y="490" width="326" height="46" rx="23" fill="#3E7C4F"/><text x="195" y="519" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">匯出備份</text><rect x="32" y="544" width="326" height="46" rx="23" fill="#7A5A3C"/><text x="195" y="573" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">從備份還原</text><rect x="16" y="644" width="358" height="116" rx="16" fill="#FFFFFF"/><text x="32" y="674" font-size="17" fill="#33291F" font-weight="bold" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">低干擾提醒</text><text x="32" y="698" font-size="12" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">平時不打擾。只有生活費即將見底 / 已超支才提醒；</text><text x="32" y="716" font-size="12" fill="#6E6256" font-weight="normal" text-anchor="start" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">每月扣款成功僅以靜默通知呈現。</text><rect x="32" y="728" width="326" height="20" rx="6" fill="#6FAE6E"/><text x="195" y="743" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="WenQuanYi Zen Hei, Noto Color Emoji, sans-serif">啟用提醒</text></svg>