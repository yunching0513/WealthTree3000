name: Deploy Web to GitHub Pages

# 把 Expo web 版自動打包並發佈到 GitHub Pages。
# 站台網址：https://yunching0513.github.io/WealthTree3000/

on:
  push:
    branches:
      - main
      - claude/wealthtree-3000-spec-fjgmn
    paths-ignore:
      - 'shots/**'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web (with GitHub Pages base path)
        env:
          EXPO_WEB_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: |
          npx expo export --platform web
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
